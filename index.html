<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/Antigone/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/Antigone/apple-touch-icon.png" />
    <title>Antigone</title>
    <script>
      // Apply a forced theme before first paint so the page doesn't flash the other one.
      try {
        const theme = JSON.parse(localStorage.getItem('antigone.theme'));
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
